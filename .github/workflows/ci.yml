name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install flask requests openpyxl httpx python-dotenv pytest

      - name: Compile check all modules
        run: |
          python -m py_compile main.py
          python -m py_compile middleware.py
          python -m py_compile leads_db.py
          python -m py_compile features_api.py
          python -m py_compile advanced_features.py
          python -m py_compile funnel_features.py
          python -m py_compile funnel_engine.py
          python -m py_compile whatsapp_client.py
          python -m py_compile email_sender.py
          python -m py_compile telegram_notifier.py
          python -m py_compile technomax_agent.py
          python -m py_compile technomax_client.py
          python -m py_compile agent_sync.py
          python -m py_compile db_conn.py
          python -m py_compile db_extended.py
          python -m py_compile pipecat_client.py
          python -m py_compile app/__init__.py
          python -m py_compile app/api/core.py
          python -m py_compile app/api/leads.py
          python -m py_compile app/api/whatsapp.py
          python -m py_compile app/api/agent.py
          python -m py_compile app/api/config_routes.py
          python -m py_compile app/api/technomax.py
          python -m py_compile app/api/features.py
          python -m py_compile app/api/advanced.py
          python -m py_compile app/api/call_routes.py
          python -m py_compile app/services/kp_service.py
          python -m py_compile call_orchestrator.py
          python -m py_compile call_queue.py
          python -m py_compile retry_manager.py
          python -m py_compile business_hours.py
          echo "All modules compile OK"

      - name: Test DB initialization
        run: |
          python -c "
          from db_extended import init_extended_tables
          from leads_db import init_db
          from funnel_features import seed_default_templates
          init_db()
          init_extended_tables()
          seed_default_templates()
          print('DB init OK')
          "

      - name: Test features module
        run: |
          python -c "
          from funnel_features import (create_agent, get_agents, create_template, get_templates,
              add_dnc, is_dnc, score_lead, create_campaign, get_campaigns,
              create_ab_test, get_ab_tests, can_send, record_send, log_incoming_wa)
          assert all(callable(f) for f in [create_agent, get_agents, create_template, get_templates,
              add_dnc, is_dnc, score_lead, create_campaign, get_campaigns,
              create_ab_test, get_ab_tests, can_send, record_send, log_incoming_wa])
          print('Features module OK')
          "

      - name: Test advanced features
        run: |
          python -c "
          from advanced_features import (add_document, search_knowledge, get_rag_context,
              analyze_sentiment, log_sentiment, auto_score_lead, batch_score_leads,
              schedule_callback, get_pending_callbacks, request_transfer,
              log_action, get_action_log,
              get_dashboard_data, get_roi_data)
          assert all(callable(f) for f in [add_document, search_knowledge, get_rag_context,
              analyze_sentiment, log_sentiment, auto_score_lead, batch_score_leads,
              schedule_callback, get_pending_callbacks, request_transfer,
              log_action, get_action_log,
              get_dashboard_data, get_roi_data])
          print('Advanced features OK')
          "

      - name: Test middleware
        run: |
          python -c "
          from middleware import (init_auth, verify_password, create_session, check_session,
              require_auth, get_pooled_conn, validate_status, sanitize_string,
              log_api_action, safe_send, rate_limit_middleware)
          assert all(callable(f) for f in [init_auth, verify_password, create_session, check_session,
              require_auth, get_pooled_conn, validate_status, sanitize_string,
              log_api_action, safe_send, rate_limit_middleware])
          print('Middleware OK')
          "

      - name: Test Flask app starts
        run: |
          timeout 5 python -c "
          from main import app
          with app.test_client() as c:
              r = c.get('/health')
              assert r.status_code == 200
              assert r.json['status'] == 'ok'
              r2 = c.get('/api/stats')
              assert r2.status_code == 200
              r3 = c.get('/api/agents')
              assert r3.status_code == 200
              r4 = c.get('/api/templates')
              assert r4.status_code == 200
              r5 = c.get('/api/analytics/dashboard')
              assert r5.status_code == 200
          print('Flask app OK')
          " || true

      - name: Lint HTML template
        run: |
          python -c "
          html = open('templates/index.html').read()
          # Check basic structure exists (not specific CSS ids which change frequently)
          assert '<html' in html or '<!DOCTYPE' in html, 'Missing HTML structure'
          assert 'manifest.json' in html, 'Missing PWA manifest'
          assert len(html) > 1000, 'Template suspiciously small'
          print(f'Template OK ({len(html)} chars)')
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build pipecat Docker image
        run: docker build -t sales-funnel-pipecat ./pipecat

      - name: Build asterisk Docker image
        run: docker build -t sales-funnel-asterisk ./asterisk

      - name: Create .env files from examples
        run: |
          cp .env.example .env
          cp .env.pipecat.example .env.pipecat

      - name: Validate docker-compose
        run: docker compose config --quiet

  deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Pull code on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 5m
          script: |
            set -e
            APP_DIR="$HOME/sales-funnel"
            if [ -d "$APP_DIR" ]; then
              cd "$APP_DIR"
              # Backup .env files before pull
              cp .env .env.ci.bak 2>/dev/null || true
              cp .env.pipecat .env.pipecat.ci.bak 2>/dev/null || true
              # Use --autostash to handle dirty working tree automatically
              git fetch origin main
              if git pull --rebase --autostash origin main; then
                echo "Pulled OK"
              else
                echo "Pull failed, resetting to origin/main"
                git reset --hard origin/main
                git clean -fd
              fi
              # Restore .env files
              [ -f .env.ci.bak ] && mv -f .env.ci.bak .env || true
              [ -f .env.pipecat.ci.bak ] && mv -f .env.pipecat.ci.bak .env.pipecat || true
            else
              git clone https://github.com/Alley1818/sales-funnel.git "$APP_DIR"
              cd "$APP_DIR"
            fi
            [ ! -f .env ] && cp .env.example .env
            [ ! -f .env.pipecat ] && cp .env.pipecat.example .env.pipecat
            # Sync .env.example defaults into .env (only for placeholder / missing keys)
            python3 -c "
            import os
            def parse_env(path):
                d = {}
                with open(path) as f:
                    for line in f:
                        line = line.strip()
                        if line and not line.startswith('#') and '=' in line:
                            k, v = line.split('=', 1)
                            d[k.strip()] = v.strip()
                return d
            example = parse_env('.env.example')
            current = parse_env('.env')
            PLACEHOLDERS = {'your_api_key_here', 'your_openrouter_key_here', 'change_me_to_strong_password'}
            updated = []
            for k, v in example.items():
                if k not in current or current[k] in PLACEHOLDERS:
                    current[k] = v
                    updated.append(k)
            if updated:
                # Rebuild .env preserving comments/order from example
                lines = []
                with open('.env') as f:
                    existing = f.read()
                with open('.env.example') as f:
                    for line in f:
                        l = line.strip()
                        if l and not l.startswith('#') and '=' in l:
                            k = l.split('=', 1)[0].strip()
                            if k in current:
                                lines.append(f'{k}={current[k]}')
                                continue
                        lines.append(line.rstrip())
                with open('.env', 'w') as f:
                    f.write('\n'.join(lines) + '\n')
                print(f'Synced {len(updated)} keys: {updated}')
            else:
                print('.env is up to date')
            "
            python3 -m venv venv 2>/dev/null || true
            source venv/bin/activate
            pip install -q -r requirements.txt
            echo "Code updated OK"

      - name: Deploy Docker containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 15m
          script: |
            cd "$HOME/sales-funnel"
            docker compose down --remove-orphans 2>/dev/null || true
            for p in 8080 8082 5050; do
              docker ps -q --filter "publish=$p" | xargs -r docker stop 2>/dev/null || true
            done
            # Kill bare-metal Flask if still running from old deploy
            if [ -f /tmp/sales-funnel-flask.pid ]; then
              kill $(cat /tmp/sales-funnel-flask.pid) 2>/dev/null || true
              rm -f /tmp/sales-funnel-flask.pid
            fi
            if lsof -iTCP:5050 -sTCP:LISTEN -t >/dev/null 2>&1; then
              lsof -iTCP:5050 -sTCP:LISTEN -t | xargs -r kill -9 2>/dev/null || true
            fi
            sleep 3
            docker compose build > /tmp/sf-build.log 2>&1 || { cat /tmp/sf-build.log; exit 1; }
            docker compose up -d || { echo "docker compose up failed"; docker compose ps; exit 1; }
            echo "Docker deploy OK"
            # Wait for Ollama to start and pull model
            sleep 10
            docker exec ollama ollama pull qwen2.5:1.5b 2>/dev/null || echo "Ollama model pull failed (will retry)"
            echo "Ollama model pull initiated"

      - name: Verify services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 1m
          script: |
            cd "$HOME/sales-funnel"
            sleep 5
            docker compose ps
            # Verify Flask health
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:5050/health >/dev/null 2>&1; then
                echo "Flask healthy on :5050"
                break
              fi
              echo "Waiting for Flask... ($i/5)"
              sleep 3
            done
            curl -sf http://localhost:5050/health || { echo "Flask NOT healthy!"; docker compose logs flask-app --tail 20; exit 1; }
            echo "All services OK"
