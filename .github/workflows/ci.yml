name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FLASK_IMAGE: ghcr.io/${{ github.repository }}/flask-app
  PIPECAT_IMAGE: ghcr.io/${{ github.repository }}/pipecat-agent
  ASTERISK_IMAGE: ghcr.io/${{ github.repository }}/asterisk

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install flask requests openpyxl httpx python-dotenv pytest

      - name: Compile check all modules
        run: |
          python -m py_compile main.py
          python -m py_compile middleware.py
          python -m py_compile leads_db.py
          python -m py_compile features_api.py
          python -m py_compile advanced_features.py
          python -m py_compile funnel_features.py
          python -m py_compile funnel_engine.py
          python -m py_compile whatsapp_client.py
          python -m py_compile email_sender.py
          python -m py_compile telegram_notifier.py
          python -m py_compile technomax_agent.py
          python -m py_compile technomax_client.py
          python -m py_compile agent_sync.py
          python -m py_compile db_conn.py
          python -m py_compile db_extended.py
          python -m py_compile pipecat_client.py
          python -m py_compile app/__init__.py
          python -m py_compile app/api/core.py
          python -m py_compile app/api/leads.py
          python -m py_compile app/api/whatsapp.py
          python -m py_compile app/api/agent.py
          python -m py_compile app/api/config_routes.py
          python -m py_compile app/api/technomax.py
          python -m py_compile app/api/features.py
          python -m py_compile app/api/advanced.py
          python -m py_compile app/api/call_routes.py
          python -m py_compile app/services/kp_service.py
          python -m py_compile call_orchestrator.py
          python -m py_compile call_queue.py
          python -m py_compile retry_manager.py
          python -m py_compile business_hours.py
          echo "All modules compile OK"

      - name: Test DB initialization
        run: |
          python -c "
          from db_extended import init_extended_tables
          from leads_db import init_db
          from funnel_features import seed_default_templates
          init_db()
          init_extended_tables()
          seed_default_templates()
          print('DB init OK')
          "

      - name: Test features module
        run: |
          python -c "
          from funnel_features import (create_agent, get_agents, create_template, get_templates,
              add_dnc, is_dnc, score_lead, create_campaign, get_campaigns,
              create_ab_test, get_ab_tests, can_send, record_send, log_incoming_wa)
          assert all(callable(f) for f in [create_agent, get_agents, create_template, get_templates,
              add_dnc, is_dnc, score_lead, create_campaign, get_campaigns,
              create_ab_test, get_ab_tests, can_send, record_send, log_incoming_wa])
          print('Features module OK')
          "

      - name: Test advanced features
        run: |
          python -c "
          from advanced_features import (add_document, search_knowledge, get_rag_context,
              analyze_sentiment, log_sentiment, auto_score_lead, batch_score_leads,
              schedule_callback, get_pending_callbacks, request_transfer,
              log_action, get_action_log,
              get_dashboard_data, get_roi_data)
          assert all(callable(f) for f in [add_document, search_knowledge, get_rag_context,
              analyze_sentiment, log_sentiment, auto_score_lead, batch_score_leads,
              schedule_callback, get_pending_callbacks, request_transfer,
              log_action, get_action_log,
              get_dashboard_data, get_roi_data])
          print('Advanced features OK')
          "

      - name: Test middleware
        run: |
          python -c "
          from middleware import (init_auth, verify_password, create_session, check_session,
              require_auth, get_pooled_conn, validate_status, sanitize_string,
              log_api_action, safe_send, rate_limit_middleware)
          assert all(callable(f) for f in [init_auth, verify_password, create_session, check_session,
              require_auth, get_pooled_conn, validate_status, sanitize_string,
              log_api_action, safe_send, rate_limit_middleware])
          print('Middleware OK')
          "

      - name: Test Flask app starts
        run: |
          timeout 5 python -c "
          from main import app
          with app.test_client() as c:
              r = c.get('/health')
              assert r.status_code == 200
              assert r.json['status'] == 'ok'
          print('Flask app OK')
          " || true

      - name: Lint HTML template
        run: |
          python -c "
          html = open('templates/index.html').read()
          assert '<html' in html or '<!DOCTYPE' in html, 'Missing HTML structure'
          assert 'manifest.json' in html, 'Missing PWA manifest'
          assert len(html) > 1000, 'Template suspiciously small'
          print(f'Template OK ({len(html)} chars)')
          "

  build-and-push:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Flask image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.FLASK_IMAGE }}:latest
            ${{ env.FLASK_IMAGE }}:${{ github.sha }}

      - name: Build and push Pipecat image
        uses: docker/build-push-action@v5
        with:
          context: ./pipecat
          push: true
          tags: |
            ${{ env.PIPECAT_IMAGE }}:latest
            ${{ env.PIPECAT_IMAGE }}:${{ github.sha }}

      - name: Build and push Asterisk image
        uses: docker/build-push-action@v5
        with:
          context: ./asterisk
          push: true
          tags: |
            ${{ env.ASTERISK_IMAGE }}:latest
            ${{ env.ASTERISK_IMAGE }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 5m
          script: |
            set -e
            APP_DIR="$HOME/sales-funnel"
            if [ -d "$APP_DIR" ]; then
              cd "$APP_DIR"
              cp .env .env.ci.bak 2>/dev/null || true
              cp .env.pipecat .env.pipecat.ci.bak 2>/dev/null || true
              git fetch origin main
              if git pull --rebase --autostash origin main; then
                echo "Pulled OK"
              else
                git reset --hard origin/main
                git clean -fd
              fi
              [ -f .env.ci.bak ] && mv -f .env.ci.bak .env || true
              [ -f .env.pipecat.ci.bak ] && mv -f .env.pipecat.ci.bak .env.pipecat || true
            else
              git clone https://github.com/Alley1818/sales-funnel.git "$APP_DIR"
              cd "$APP_DIR"
            fi
            [ ! -f .env ] && cp .env.example .env
            [ ! -f .env.pipecat ] && cp .env.pipecat.example .env.pipecat
            # Pull pre-built images from GHCR
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker compose pull flask-app pipecat-agent asterisk
            docker compose up -d
            echo "Deploy OK"

      - name: Verify services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 1m
          script: |
            cd "$HOME/sales-funnel"
            sleep 5
            docker compose ps
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:5050/health >/dev/null 2>&1; then
                echo "Flask healthy on :5050"
                break
              fi
              echo "Waiting for Flask... ($i/5)"
              sleep 3
            done
            curl -sf http://localhost:5050/health || { echo "Flask NOT healthy!"; docker compose logs flask-app --tail 20; exit 1; }
            echo "All services OK"
