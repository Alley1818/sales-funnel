services:
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales_funnel_app
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - .env
    environment:
      - EVO_API_URL=http://evolution_api:8080
      - EVO_API_KEY=your_api_key_here
    volumes:
      - ./leads.db:/app/leads.db
      - ./config.json:/app/config.json
      - ./.auth.json:/app/.auth.json
      - ./sales_funnel.log:/app/sales_funnel.log
    depends_on:
      evolution-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:v2.3.2
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  pipecat-agent:
    build:
      context: ./pipecat
      dockerfile: Dockerfile
    container_name: pipecat_agent
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - .env.pipecat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./pipecat/data:/app/data
      - ./pipecat/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      asterisk:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    container_name: asterisk
    restart: unless-stopped
    network_mode: host
    volumes:
      - asterisk_recordings:/var/spool/asterisk/monitor/
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    container_name: evolution_postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution_db
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evo_pass_2026}
    volumes:
      - pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    container_name: evolution_redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  evolution_instances:
  pg_data:
  redis_data:
  asterisk_recordings:
