services:
  flask-app:
    image: ghcr.io/alley1818/sales-funnel/flask-app:latest
    container_name: sales_funnel_app
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - .env
    environment:
      - EVO_API_URL=http://evolution_api:8080
      - EVO_API_KEY=${AUTHENTICATION_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - WA_WEBHOOK_SECRET=${WA_WEBHOOK_SECRET:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - OLLAMA_URL=http://ollama:11434
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:1.5b}
      - CONFIG_PATH=/app/config_data/config.json
      - PIPECAT_URL=http://pipecat-agent:8082
    volumes:
      - ./leads.db:/app/leads.db
      - ./config_data:/app/config_data
      - ./.auth.json:/app/.auth.json
      - ./uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      evolution-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:v2.3.2
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  pipecat-agent:
    image: ghcr.io/alley1818/sales-funnel/pipecat-agent:latest
    container_name: pipecat_agent
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - .env.pipecat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./pipecat/data:/app/data
      - ./pipecat/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      asterisk:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  asterisk:
    image: ghcr.io/alley1818/sales-funnel/asterisk:latest
    container_name: asterisk
    restart: unless-stopped
    network_mode: host
    volumes:
      - asterisk_recordings:/var/spool/asterisk/monitor/
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    container_name: evolution_postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution_db
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evo_pass_2026}
    volumes:
      - pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    container_name: evolution_redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  evolution_instances:
  pg_data:
  redis_data:
  asterisk_recordings:
  ollama_data:
