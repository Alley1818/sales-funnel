[globals]

[general]

[default]

; Echo test for audio verification
exten = 100,1,NoOp(Echo test)
same  = n,Answer()
same  = n,Echo()

; Pipecat AI agent - call this to talk to AI
exten = 200,1,NoOp(Pipecat AI Agent)
same  = n,Answer()
same  = n,Dial(WebSocket/media_connection_pipecat/c(slin16)f(json))
same  = n,Hangup()

; Internal dialplan
[internal]
exten => _X.,1,Dial(PJSIP/${EXTEN})
same  => n,Hangup()

; Incoming calls from trunk
[from-trunk]
exten => _X.,1,NoOp(Incoming call from trunk: ${EXTEN})
same  => n,Answer()
same  => n,Dial(WebSocket/media_connection_pipecat/c(slin16)f(json))
same  => n,Hangup()

; Calls from pipecat agent (outbound)
[from-pipecat]
exten => _X.,1,NoOp(Outbound call from AI agent: ${EXTEN})
same  => n,Dial(PJSIP/${EXTEN})
same  => n,Hangup()
