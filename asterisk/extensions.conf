; Dialplan for Sales Funnel
; Contexts: internal (pipecat), outbound (Tele2 trunk)

[general]
static=yes
writeprotect=no
clearglobalvars=no

[default]
; Echo test
exten => 100,1,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()

; Pipecat AI agent
exten => 200,1,Answer()
 same => n,Wait(1)
 same => n,Stasis(pipecat_agent)
 same => n,Hangup()

[outbound]
; Outbound calls via Tele2 trunk
; Pattern: 7XXXXXXXXXX (11 digits, Kazakhstan)
exten => _7XXXXXXXXXX,1,Set(CALLERID(num)=77003860130)
 same => n,Set(CALLERID(name)=Technomax)
 same => n,Dial(PJSIP/${EXTEN}@tele2-endpoint,60,TtwW)
 same => n,Hangup()

; Pattern: 8XXXXXXXXXX (convert to 7XXXXXXXXXX)
exten => _8XXXXXXXXXX,1,Set(NUMBER=7${EXTEN:1})
 same => n,Set(CALLERID(num)=77003860130)
 same => n,Dial(PJSIP/${NUMBER}@tele2-endpoint,60,TtwW)
 same => n,Hangup()

; Pattern: +7XXXXXXXXXX (strip +)
exten => _+7XXXXXXXXXX,1,Set(NUMBER=${EXTEN:1})
 same => n,Set(CALLERID(num)=77003860130)
 same => n,Dial(PJSIP/${NUMBER}@tele2-endpoint,60,TtwW)
 same => n,Hangup()

[internal]
; Internal extensions for pipecat agent
include => default

; Bridge to outbound for external calls
exten => _X.,1,Goto(outbound,${EXTEN},1)
