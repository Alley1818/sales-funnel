[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; === SIP Trunk to mobile operator (KZ) ===
; Fill in when you have SIP provider credentials
;[sip-trunk]
;type=registration
;outbound_auth=sip-trunk-auth
;server_uri=sip:voip.provider.kz
;retry_interval=60
;
;[sip-trunk-auth]
;type=auth
;auth_type=userpass
;username=YOUR_SIP_USER
;password=YOUR_SIP_PASSWORD
;
;[sip-trunk-aor]
;type=aor
;contact=sip:voip.provider.kz
;
;[sip-trunk-endpoint]
;type=endpoint
;context=from-trunk
;disallow=all
;allow=ulaw
;allow=alaw
;outbound_auth=sip-trunk-auth
;aors=sip-trunk-aor

; === Internal endpoint for pipecat agent ===
[pipecat-agent]
type=endpoint
context=from-pipecat
disallow=all
allow=ulaw
allow=alaw
allow=slin16
aors=pipecat-agent-aor
direct_media=no

[pipecat-agent-aor]
type=aor
max_contacts=5

; === Softphone for testing ===
[softphone]
type=endpoint
context=internal
disallow=all
allow=ulaw
allow=alaw
auth=softphone-auth
aors=softphone

[softphone-auth]
type=auth
auth_type=userpass
username=softphone
password=soft123

[softphone]
type=aor
max_contacts=2
